name: Tests

on:
  push:
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - 'docs/*'
  pull_request:
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - 'docs/*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nim-version: ['stable']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup nim environment
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Setup Vecs
        run: nimble install cborious

      - name: Running tests
        run: |
          testament cat /
          nim c -r -d:ArchetypeWords=2 "tests/manycomponents.nim"

      - name: Running benchmarks against the baseline commit
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            baseline="origin/${{ github.base_ref }}"
          else
            baseline="HEAD^"
          fi

          if ! git rev-parse --verify --quiet "$baseline^{commit}" > /dev/null; then
            echo "No baseline commit at $baseline, benchmarking without a comparison."
            nim c -r -d:danger --nimcache:nimcache/current "benchs/vecsbench.nim" current.csv
            exit 0
          fi

          echo "Baseline: $baseline ($(git rev-parse --short "$baseline"))"

          baseline_ready=true
          git checkout "$baseline" -- src
          if ! nim c -d:danger --nimcache:nimcache/baseline \
              -o:/tmp/vecs-benchmark-baseline "benchs/vecsbench.nim"; then
            baseline_ready=false
          fi
          git checkout HEAD -- src

          nim c -d:danger --nimcache:nimcache/current \
            -o:/tmp/vecs-benchmark-current "benchs/vecsbench.nim"

          if [ "$baseline_ready" != true ]; then
            echo "Baseline src/ did not build against the current benchmarks, skipping comparison."
            /tmp/vecs-benchmark-current current.csv
            exit 0
          fi

          nim c -d:danger --nimcache:nimcache/comparison \
            -o:/tmp/compare-benchmarks "benchs/compare_benchmarks.nim"

          /tmp/vecs-benchmark-current current-a.csv > /tmp/current-a.log
          /tmp/vecs-benchmark-baseline baseline-a.csv > /tmp/baseline-a.log
          /tmp/vecs-benchmark-baseline baseline-b.csv > /tmp/baseline-b.log
          /tmp/vecs-benchmark-current current-b.csv > /tmp/current-b.log

          /tmp/compare-benchmarks \
            current-a.csv current-b.csv baseline-a.csv baseline-b.csv
